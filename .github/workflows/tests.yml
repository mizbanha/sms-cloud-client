name: tests

# ⚠️ No secret is needed and none is used. The suite fakes every network call:
# the SMS providers and SMS Cloud both answer through Http::fake(), and nothing
# here can send an SMS or reach a real Cloud.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: PHP ${{ matrix.php }} · ${{ matrix.database }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
        # The outbox lives in the CUSTOMER's database, so the suite runs on the
        # engines customers actually have — not only SQLite.
        database: [sqlite, mysql, pgsql]

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: secret
          MYSQL_DATABASE: sms_cloud_client_test
        ports: ['3306:3306']
        options: >-
          --health-cmd "mysqladmin ping -psecret"
          --health-interval 5s --health-timeout 5s --health-retries 15
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: sms_cloud_client_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10

    env:
      SMS_CLOUD_TEST_DB: ${{ matrix.database == 'sqlite' && '' || matrix.database }}
      SMS_CLOUD_TEST_DB_HOST: 127.0.0.1
      SMS_CLOUD_TEST_DB_PORT: ${{ matrix.database == 'mysql' && '3306' || '5432' }}
      SMS_CLOUD_TEST_DB_USERNAME: ${{ matrix.database == 'mysql' && 'root' || 'postgres' }}
      SMS_CLOUD_TEST_DB_PASSWORD: secret

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, intl, pdo_sqlite, pdo_mysql, pdo_pgsql
          coverage: none

      - name: Validate composer.json
        run: composer validate --strict

      # No lock file is committed - this is a library, so resolving against the
      # current constraints is the thing worth testing. Core comes from Packagist
      # like any other dependency, which is what a customer installing this
      # package gets.
      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      # Asserted, not printed, so a green run is itself the evidence that this
      # package was tested against what a customer installs: no checkout beside
      # it, no repository override in the manifest, and Core resolved from the
      # registry as a dist archive.
      - name: Assert Core came from the registry
        run: |
          test ! -e .core
          jq -e '.repositories == null' composer.json > /dev/null
          jq -r '.packages[] | select(.name == "mizbanha/laravel-sms")
                 | "Core \(.version) via \(.dist.type) \(.dist.url)"' composer.lock
          jq -e '.packages[] | select(.name == "mizbanha/laravel-sms")
                 | select(.dist.type == "zip")
                 | select(.source.url == "https://github.com/mizbanha/laravel-sms.git")' composer.lock > /dev/null

      - name: Run the test suite
        run: vendor/bin/pest
